<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 980" width="400" height="980" class="arm">
  <defs>
    <style>
      .arm { --open: 0; }
      .stroke { fill: #ffffff; stroke: #061a1e; stroke-width: 10; stroke-linejoin: round; stroke-linecap: round; }
      .dark { fill: #061a1e; }
      .blue { fill: #1f5fd6; }
      .yellow { fill: #ffbd00; }
      .light { fill: #bcd6ff; }
      .cable { fill: none; stroke: #1f5fd6; stroke-width: 6; stroke-linecap: round; }
      .finger { transform-box: fill-box; transform-origin: 50% 0; }
      .f-l { transform: rotate(calc(var(--open) * 28deg)); }
      .f-r { transform: rotate(calc(var(--open) * -28deg)); }
      .f-m { transform: rotate(calc(var(--open) * 4deg)); }
      .thumb { transform-box: fill-box; transform-origin: 100% 0; transform: rotate(calc(-58deg + var(--open) * -22deg)); }
      .tip { transform-box: fill-box; transform-origin: 50% 0; transform: rotate(calc(var(--open) * 10deg)); }
    </style>
  </defs>
  <!-- upper arm, runs off the top of the frame -->
  <rect class="stroke" x="152" y="-60" width="96" height="430" rx="48"/>
  <path class="cable" d="M176 -40 C170 100 232 180 226 340"/>
  <!-- elbow -->
  <circle class="stroke" cx="200" cy="360" r="60"/>
  <circle class="blue" cx="200" cy="360" r="26"/>
  <circle class="dark" cx="200" cy="360" r="8"/>
  <!-- forearm -->
  <rect class="stroke" x="164" y="380" width="72" height="290" rx="36"/>
  <rect class="yellow" x="182" y="470" width="36" height="14" rx="7"/>
  <rect class="yellow" x="182" y="500" width="36" height="14" rx="7"/>
  <!-- wrist -->
  <circle class="stroke" cx="200" cy="676" r="44"/>
  <circle class="yellow" cx="200" cy="676" r="18"/>
  <!-- palm -->
  <rect class="stroke" x="128" y="700" width="144" height="120" rx="34"/>
  <circle class="light" cx="200" cy="760" r="20"/>
  <circle class="dark" cx="200" cy="760" r="6"/>
  <!-- thumb -->
  <g class="thumb">
    <rect class="stroke" x="52" y="736" width="92" height="40" rx="20"/>
    <circle class="blue" cx="66" cy="756" r="9"/>
  </g>
  <!-- fingers: left, middle, right; each has a base segment and a tip segment -->
  <g class="finger f-l">
    <rect class="stroke" x="132" y="812" width="40" height="86" rx="20"/>
    <circle class="blue" cx="152" cy="894" r="12"/>
    <g class="tip"><rect class="stroke" x="134" y="892" width="36" height="72" rx="18"/></g>
  </g>
  <g class="finger f-m">
    <rect class="stroke" x="180" y="812" width="40" height="86" rx="20"/>
    <circle class="blue" cx="200" cy="894" r="12"/>
    <g class="tip"><rect class="stroke" x="182" y="892" width="36" height="72" rx="18"/></g>
  </g>
  <g class="finger f-r">
    <rect class="stroke" x="228" y="812" width="40" height="86" rx="20"/>
    <circle class="blue" cx="248" cy="894" r="12"/>
    <g class="tip"><rect class="stroke" x="230" y="892" width="36" height="72" rx="18"/></g>
  </g>
</svg>
